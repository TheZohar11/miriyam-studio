<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Maryuma Art - Studio Time</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>

  <body>
    <header>
      <nav>
        <a>workshop</a>
        <a>studio time</a>
        <a>single class</a>
        <span id="user-greeting"></span>
        <button id="logout-btn" class="logout-btn">Logout</button>
      </nav>
    </header>
    <h1 id="studio">studio time</h1>
    <section class="new">
      <label for="name-input">name:</label>
      <input id="name-input" />
      <label for="date-input">date:</label>
      <input id="date-input" type="date" placeholder="dd/mm/yyyy" />
      <button id="new-costumer">add</button>
    </section>
    <ul id="card-owners"></ul>

    <div id="overlay" class="overlay"></div>

    <div class="cancellation" id="modal">
      <p>Are you sure you want to cancel?</p>
      <button id="yes">YES</button>
      <button id="no">NO</button>
    </div>

    <div class="remove" id="modal2" style="display: none">
      <p>Are you sure you want to remove student?</p>
      <button id="delete">YES</button>
      <button id="undelete">NO</button>
    </div>

    <script type="module" src="/src/app.js"></script>
    <footer>
      <p class="Copyright text">
        Copyright &copy; 2026 by Zohar Simhon &amp; Michael Kupfer. All rights reserved.
      </p>
    </footer>
  </body>
</html>
