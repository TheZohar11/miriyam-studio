<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Register - Maryuma Art</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="auth-container">
      <h1 class="auth-title">maryuma art</h1>
      <form id="register-form" class="auth-form">
        <h2>Register</h2>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" required placeholder="Your name" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="your@email.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="Password (min 6 chars)" minlength="6" />
        </div>
        <p id="error-msg" class="error-msg"></p>
        <button type="submit">Register</button>
        <p class="auth-link">Already have an account? <a href="/login.html">Login</a></p>
      </form>
    </div>
    <footer>
      <p class="Copyright text">
        Copyright &copy; 2026 by Zohar Simhon &amp; Michael Kupfer. All rights reserved.
      </p>
    </footer>
    <script type="module" src="/src/register.js"></script>
  </body>
</html>
